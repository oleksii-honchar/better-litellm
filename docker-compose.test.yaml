# Local test — validates the better-litellm Docker image starts and routes work.
# Usage: cd better-litellm && BETTER_LITELLM_IMAGE=tuiteraz/better-litellm:<tag-from-scripts/build.sh> \
#          docker compose -f docker-compose.test.yaml up -d
# The image tag is version-agnostic: pass the tag built by scripts/build.sh or
# scripts/build-and-push.sh (derived from pyproject.toml) via BETTER_LITELLM_IMAGE.

services:
  test-db:
    image: postgres:16-alpine
    container_name: better-litellm-test-db
    restart: "no"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_db_password
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-litellm:
    image: ${BETTER_LITELLM_IMAGE:?Set BETTER_LITELLM_IMAGE to the built image, e.g. tuiteraz/better-litellm:main-v<version>-stable-<stamp> from scripts/build.sh}
    container_name: better-litellm-test
    restart: "no"
    ports:
      - "4000:4000"
    volumes:
      - ./test-config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    environment:
      - LITELLM_MASTER_KEY=test-key-for-local-testing
    depends_on:
      test-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=10)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
